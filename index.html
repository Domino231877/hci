<!DOCTYPE html>
<html>
<head>
    <title>Online Member Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online Member Registration</h1>
    <p class="subtitle">Please provide the information below</p>

    <h2>Account Information</h2>

    <label>CRN / SS Number <span class="required">*</span></label>
    <input type="text" id="crn" placeholder="Enter your CRN / SS Number">

    <label>Email Address <span class="required">*</span></label>
    <input type="email" id="email" placeholder="Enter your email">

    <label>Confirm Email Address <span class="required">*</span></label>
    <input type="email" id="confirmEmail" placeholder="Confirm your email">

    <label>Preferred User ID <span class="required">*</span></label>
    <input type="text" id="username" placeholder="Create a username">

    <label>Confirm Preferred User ID <span class="required">*</span></label>
    <input type="text" id="confirmUsername" placeholder="Confirm your username">

    <h2>Personal Information</h2>

    <div class="row">
        <div>
            <label>Last Name <span class="required">*</span></label>
            <input type="text" id="lastName" placeholder="Last Name">
        </div>

        <div>
            <label>First Name <span class="required">*</span></label>
            <input type="text" id="firstName" placeholder="First Name">
        </div>
    </div>

    <label>Middle Name</label>
    <input type="text" id="middleName" placeholder="Middle Name">

    <label>Date of Birth <span class="required">*</span></label>
    <input type="date" id="birthDate">

    <h2>Mailing Address</h2>

    <label>Room / Floor / Unit No. & Building Name</label>
    <input type="text" id="building" placeholder="Building information">

    <label>House / Lot & Block No.</label>
    <input type="text" id="house" placeholder="House or lot information">

    <label>Street</label>
    <input type="text" id="street" placeholder="Street">

    <label>Subdivision</label>
    <input type="text" id="subdivision" placeholder="Subdivision">

    <label>Location</label>
    <select id="location">
        <option>Metro Manila</option>
        <option>Province</option>
    </select>

    <button type="button" onclick="register()">Register</button>

</div>

<script src="script.js"></script>

</body>
</html>
